<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Quant Platform — Mission Control</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1220'/%3E%3Cpath d='M7 21l5-7 4 4 9-11' stroke='%234ade80' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app" class="app" aria-busy="true">
      <header class="masthead">
        <div>
          <h1>Quant&nbsp;Platform</h1>
          <p class="masthead__subtitle" id="subtitle">Paper Trading · Risk V2 · BTC/USDT</p>
        </div>
        <div class="masthead__state">
          <span class="health health--info" id="health">CONNECTING</span>
          <span class="updated" id="updated">contacting the service…</span>
        </div>
      </header>

      <div class="badges" id="badges"></div>

      <!-- The one paragraph somebody reads before deciding whether to read anything else.
           Assembled server-side from the panels below, so it cannot contradict them. -->
      <section class="summary summary--info" id="summary" aria-live="polite">
        <div class="summary__head">
          <span class="summary__eyebrow">Quant AI Summary</span>
          <span class="summary__verdict" id="summary-verdict">—</span>
        </div>
        <p class="summary__text" id="summary-text">Waiting for the first reading…</p>
        <ul class="summary__blockers" id="summary-blockers" hidden></ul>
      </section>

      <main class="brains" id="brains"></main>

      <footer class="footer">
        <span>Read-only observer · no control actions available</span>
        <span id="schema"></span>
      </footer>
    </div>

    <!-- WHY panel. Opens over the page when any KPI is clicked. -->
    <div class="why" id="why" hidden role="dialog" aria-modal="true" aria-labelledby="why-title">
      <div class="why__backdrop" data-close></div>
      <div class="why__sheet">
        <button class="why__close" type="button" data-close aria-label="Close">×</button>
        <span class="why__eyebrow">Why?</span>
        <h2 class="why__title" id="why-title">—</h2>
        <p class="why__value" id="why-value">—</p>
        <dl class="why__list">
          <dt>What it means</dt>
          <dd id="why-meaning">—</dd>
          <dt>Where it comes from</dt>
          <dd id="why-source">—</dd>
          <dt>Why this reading</dt>
          <dd id="why-reason">—</dd>
        </dl>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
