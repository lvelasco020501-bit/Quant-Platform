[project]
name = "quant-platform"
version = "0.1.0"
description = "Modular, exchange-agnostic, strategy-agnostic quantitative trading platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Quant Platform Team" }]
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "fastapi>=0.115,<1",
    "typer>=0.15,<1",
]

[project.scripts]
quantplatform = "quantplatform.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6.0,<8",
    "hypothesis>=6.122,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2",
    # SQLite is only used to exercise the repository and migrations in tests without a
    # running PostgreSQL instance; the production target remains PostgreSQL via psycopg.
    "aiosqlite>=0.20,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantplatform"]

# --------------------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "DTZ",   # flake8-datetimez (timezone-aware datetimes only)
    "E",     # pycodestyle errors
    "ERA",   # eradicate (commented-out code)
    "F",     # pyflakes
    "FBT",   # flake8-boolean-trap
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "N",     # pep8-naming
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RUF",   # ruff-specific
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports (bans relative imports)
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "D107", # constructor arguments are documented in the class docstring (Google convention)
    "D203", # incompatible with D211
    "D213", # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG002", # test doubles must keep the overridden signature even when unused
    "D100", # missing module docstring is acceptable in tests
    "D101", # test doubles do not need class docstrings
    "D102", # test doubles do not need method docstrings
    "D103", # missing docstring in public function
    "D104", # test packages do not need docstrings
    "S105", # fixture values named "secret" are not real credentials
    "S106", # fixture values named "secret" are not real credentials
    "PLR0913", # factories legitimately take many keyword arguments
    "PLR2004", # magic values are the point of assertions
    "S101", # assert is required by pytest
    "SLF001", # tests may inspect private members
]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_decorated = false
implicit_reexport = false
show_error_codes = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast isolated unit test",
    "architecture: dependency boundary / structural test",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/quantplatform"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
